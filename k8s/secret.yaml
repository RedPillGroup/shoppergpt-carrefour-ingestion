apiVersion: v1
kind: Secret
metadata:
  name: carrefour-ingestion-secret
# At deploy the CI overwrites `data` with the DEV_SECRETS / PROD_SECRETS GitHub
# secret (a YAML map of KEY: value), then base64-encodes it — so the actual keys
# come from that GitHub secret, not from here. The entries below document exactly
# what DEV_SECRETS / PROD_SECRETS MUST contain.
#
# Required:
#   MONGO_URI            mongodb+srv connection string
#   ENV                  dev | prod  (selects waib_carrefour_traiteur[_dev]_db)
#   GCS_BUCKET           dev:  carrefour-shoppergpt-ingestion
#                        prod: carrefour-shoppergpt-ingestion-prod  (set explicitly — an empty
#                        value silently falls back to the DEV bucket, see ingest/config.py)
#   GCS_PROJECT          waib-459906
#   GEMINI_API_KEY       Google AI Studio key (product categorization)
#   OPENAI_API_KEY       embeddings for the pinecone step
#   PINECONE_API_KEY     pinecone
# Optional (have sane defaults in ingest/config.py):
#   MONGO_DB, PINECONE_INDEX_NAME (default follows ENV: waib-carrefour-{dev,prod}-large), EMBEDDING_MODEL, LOG_LEVEL, LOG_FORMAT
#
# GCS auth is NOT a key here — the pod reads the bucket via Workload Identity
# (KSA -> GSA, see the CronJob manifests and README "Deployment"); no GCS
# credentials are stored in this secret.
data:
  MONGO_URI: ""
  ENV: ""
  GCS_BUCKET: ""
  GCS_PROJECT: ""
  GEMINI_API_KEY: ""
  OPENAI_API_KEY: ""
  PINECONE_API_KEY: ""
  LOG_FORMAT: ""
