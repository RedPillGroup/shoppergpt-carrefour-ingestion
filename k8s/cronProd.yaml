apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-ingestion-carrefour
spec:
  # See k8s/cron.yaml for the schedule rationale.
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          # GCS via Workload Identity — KSA bound to carrefour-ingestion-sa
          # (roles/iam.workloadIdentityUser + storage.objectViewer). See
          # k8s/cron.yaml and README "Deployment".
          serviceAccountName: carrefour-ingestion
          restartPolicy: Never
          containers:
            - name: carrefour-ingestion
              image: europe-west1-docker.pkg.dev/waib-459906/shoppergpt-carrefour-ingestion/shoppergpt-carrefour-ingestion-prod:latest
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: carrefour-ingestion-secret
              command: ["/bin/sh"]
              args: ["-c", "poetry run python run.py --fetch"]
              resources:
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1536Mi"
