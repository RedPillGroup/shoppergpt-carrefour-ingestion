apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-ingestion-carrefour
spec:
  # Daily at 07:15 Europe/Paris, year-round (timeZone below keeps it at 07:15 local
  # across the summer/winter clock change; without it Kubernetes cron is UTC).
  # Carrefour publishes its daily export around 04:45 UTC (06:45 Paris) — measured on
  # 2026-10-09 — so this slot runs AFTER the export and ingests the same-day files
  # (the previous 03:00 UTC slot ran before it and always lagged by one day).
  # The publish time is not guaranteed: --fetch always takes the latest object and
  # the skip logic (ingestion_meta marker in Mongo) ingests only when a genuinely new
  # file has landed, so a late export is simply picked up on the next run.
  schedule: "15 7 * * *"
  timeZone: "Europe/Paris"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          # GCS access via Workload Identity (this cluster has WI enabled, so the
          # node default SA is NOT usable). This KSA must be bound to the
          # carrefour-ingestion-sa GSA — roles/iam.workloadIdentityUser on the GSA
          # for serviceAccount:waib-459906.svc.id.goog[default/carrefour-ingestion],
          # plus storage.objectViewer on the bucket. See README "Deployment".
          serviceAccountName: carrefour-ingestion
          restartPolicy: Never
          containers:
            - name: carrefour-ingestion
              image: europe-west1-docker.pkg.dev/waib-459906/shoppergpt-carrefour-ingestion/shoppergpt-carrefour-ingestion-dev:latest
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: carrefour-ingestion-secret
              command: ["/bin/sh"]
              args: ["-c", "poetry run python run.py --fetch"]
              resources:
                # Placeholder — tune after observing a real run. The prices export
                # is ~50 MB, loaded into an in-memory price index; the pinecone step
                # embeds ~1.3k products via OpenAI.
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1536Mi"
