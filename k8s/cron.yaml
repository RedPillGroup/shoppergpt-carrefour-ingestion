apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-ingestion-carrefour
spec:
  # Daily at 03:00 UTC (05:00 Europe/Paris) — deep off-peak, so a full ingest never
  # competes with live traffic (midday is a usage peak). It likely runs before
  # Carrefour's daily export publishes (exact time unconfirmed), so it may ingest
  # the PREVIOUS day's export and pick up the new one on the next run (~1 day lag,
  # fine for slow-moving catalogue data). --fetch always takes the latest object
  # and the skip logic avoids re-ingesting unchanged data, so the schedule doesn't
  # depend on knowing the export time.
  schedule: "0 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          # GCS access via Workload Identity (this cluster has WI enabled, so the
          # node default SA is NOT usable). This KSA must be bound to the
          # carrefour-ingestion-sa GSA — roles/iam.workloadIdentityUser on the GSA
          # for serviceAccount:waib-459906.svc.id.goog[default/carrefour-ingestion],
          # plus storage.objectViewer on the bucket. See README "Deployment".
          serviceAccountName: carrefour-ingestion
          restartPolicy: Never
          containers:
            - name: carrefour-ingestion
              image: europe-west1-docker.pkg.dev/waib-459906/shoppergpt-carrefour-ingestion/shoppergpt-carrefour-ingestion-dev:latest
              imagePullPolicy: Always
              envFrom:
                - secretRef:
                    name: carrefour-ingestion-secret
              command: ["/bin/sh"]
              args: ["-c", "poetry run python run.py --fetch"]
              resources:
                # Placeholder — tune after observing a real run. The prices export
                # is ~50 MB, loaded into an in-memory price index; the pinecone step
                # embeds ~1.3k products via OpenAI.
                requests:
                  cpu: "250m"
                  memory: "512Mi"
                limits:
                  cpu: "1"
                  memory: "1536Mi"
